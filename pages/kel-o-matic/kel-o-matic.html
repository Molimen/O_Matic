<!-- Ambient Background Glows -->
<div class="absolute top-0 -left-20 w-96 h-96 bg-primary-dim/10 rounded-full blur-[120px] pointer-events-none"></div>
<div class="absolute bottom-40 -right-20 w-[500px] h-[500px] bg-secondary-dim/5 rounded-full blur-[150px] pointer-events-none"></div>

<!-- Main Configuration Grid -->
<div class="gap-6 max-w-4xl mx-auto px-6">
    <!-- Settings Card -->
    <div class="glass-panel rounded-lg p-8 space-y-6">
        <!-- Dropdown Group -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="space-y-2">
                <label class="text-[16px] uppercase tracking-[0.2em] font-bold text-pink-500/80 px-1">Class</label>

                <div class="relative">
                    <select class="class-select w-full bg-surface-container-highest border-0 rounded-full py-4 px-6 text-on-surface text-lg appearance-none focus:ring-2 focus:ring-primary/50 transition-all font-medium cursor-pointer">
                        <option value="1">X-1</option>
                        <option value="2">X-2</option>
                        <option value="3">X-3</option>
                        <option value="4">X-4</option>
                        <option value="5">X-5</option>
                        <option value="6">X-6</option>
                    </select>

                    <!-- <span class="material-symbols-outlined absolute right-6 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none" data-icon="expand_more">expand_more</span> -->
                </div>
            </div>

            <div class="space-y-2">
                <label class="text-[16px] uppercase tracking-[0.2em] font-bold text-pink-500/80 px-1">Generation Type</label>

                <div class="relative group">
                    <select class="generation-type disabled:opacity-40 disabled:cursor-not-allowed w-full bg-surface-container-highest border-0 rounded-full py-4 px-6 text-on-surface text-lg appearance-none focus:ring-2 focus:ring-primary/50 transition-all font-medium cursor-pointer">
                        <option value="absent">Student Absent</option>
                        <option value="name">Student Name</option>
                    </select>

                    <!-- <span class="material-symbols-outlined absolute right-6 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none" data-icon="expand_more">expand_more</span> -->
                </div>
            </div>
        </div>

        <div class="space-y-2">
            <label class="text-[16px] uppercase tracking-[0.2em] font-bold text-pink-500/80 px-1">Type Search</label>

            <div class="relative group">
                <select class="type-search w-full bg-surface-container-highest border-0 rounded-full py-4 px-6 text-on-surface text-lg appearance-none focus:ring-2 focus:ring-primary/50 transition-all font-medium cursor-pointer">
                    <option value="group">Group</option>
                    <option value="member">Member</option>
                </select>

                <!-- <span class="material-symbols-outlined absolute right-6 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none" data-icon="expand_more">expand_more</span> -->
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 items-end">
            <!-- Number Input -->
            <div class="space-y-2">
                <label class="text-[16px] uppercase tracking-[0.2em] font-bold text-pink-500/80 px-1">How Much</label>
                
                <div class="flex items-center bg-surface-container-highest rounded-full px-6">
                    <input class="total-item w-full bg-transparent border-0 py-4 text-on-surface focus:ring-0 font-medium text-lg" type="number" value="3" min="3" max="10"/>
                    <!-- <span class="text-on-surface-variant text-xs font-bold ml-2">idk</span> -->
                </div>
            </div>

            <!-- not gonna implement it btw. just as decoration -->
            <div class="flex items-center justify-between bg-surface-container-low border border-white/5 rounded-full space-y-2 px-6 py-4">
                <label class="text-[16px] uppercase tracking-[0.2em] font-bold text-pink-500/80 px-1">Smart Finder</label>
                
                <!-- bg-primary shadow-[0_0_15px_rgba(255,136,181,0.5)] for checked state else bg-surface-container-highest -->
                <button disabled class="relative inline-flex h-6 w-11 items-center rounded-full bg-surface-container-highest disabled:opacity-40 disabled:cursor-not-allowed">
                    <!-- translate-x-6 for checked state else translate-x-1 -->
                    <span class="translate-x-1 inline-block h-4 w-4 transform rounded-full bg-white transition"></span>
                </button>
            </div>
        </div>

        <div class="space-y-2">
            <label class="text-[16px] uppercase tracking-[0.2em] font-bold text-pink-500/80 px-1">Message</label>
            
            <div class="space-y-2 px-6 py-4 relative glass-panel rounded-lg border border-outline-variant/10">
                <span class="message-item text-xl text-neon-green">nothing to do</span>
            </div>
        </div>
    </div>
</div>

<!-- Action Area -->
<div class="mt-12 flex justify-center px-6">
    <button class="process-button w-full md:w-auto md:min-w-[300px] bg-neon-gradient text-on-primary-fixed text-xl font-bold py-5 px-12 rounded-full shadow-[0_0_40px_-5px_rgba(255,136,181,0.6)] hover:shadow-[0_0_30px_rgba(255,136,181,0.4)] active:scale-95 transition-all flex items-center justify-center gap-3">
        <span class="material-symbols-outlined" data-icon="settings_input_component">settings_input_component</span>
        PROCESS GROUP
    </button>
</div>

<!-- Result Area -->
<div class="result-container max-w-4xl mx-auto p-6 relative glass-panel rounded-lg border border-outline-variant/10 mt-12 hidden">
    <div class="flex items-center bg-surface-container-highest rounded-full px-6 mb-6">
        <input class="w-full bg-transparent border-0 py-4 text-on-surface focus:ring-0 font-medium text-3xl text-center" style="font-family: 'SFPro', sans-serif;" type="text" placeholder="Group Name"/>
    </div>

    <div class="result-grid grid grid-cols-[repeat(auto-fit,minmax(min(90px,100%),1fr))] gap-6">
        <!-- Generated groups will be appended here -->
    </div>
</div>
